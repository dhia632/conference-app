<section class="card teal">
  <div class="head">
    <div class="icon" aria-hidden="true">📅</div>
    <div>
      <h2>Liste des conférences à venir</h2>
      <p class="sub">Cliquez sur une conférence pour afficher ses détails.</p>
    </div>
  </div>

  <input
    class="search"
    type="text"
    placeholder="Taper le titre de la conférence"
    [(ngModel)]="search"
  />

  <div class="grid">
    @for (conf of filtered(); track conf.id) {
      <app-conference-card [conference]="conf" (register)="register($event)" />
    } @empty {
      <p class="empty">
        @if (conferences().length === 0) {
          Aucune conférence enregistrée.
        } @else {
          Aucune conférence ne correspond à votre recherche.
        }
      </p>
    }
  </div>
</section>
