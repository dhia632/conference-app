<article class="conf" (click)="toggleDetails()">
  <h3>{{ conference().title | uppercase }}</h3>
  <p><strong>Date :</strong> {{ conference().date | date: 'dd/MM/yyyy' }}</p>
  <p><strong>Lieu :</strong> {{ conference().place }}</p>
  <p><strong>Places restantes :</strong> {{ remaining() }}</p>
  @if (showDetails()) {
    <p class="details">{{ conference().description }}</p>
  }
  <button
    type="button"
    class="btn"
    [class.green]="!isFull() && !isAlmostFull()"
    [class.orange]="isAlmostFull()"
    [class.red]="isFull()"
    [disabled]="isFull()"
    (click)="onRegister($event)"
  >
    S'inscrire
  </button>
</article>
