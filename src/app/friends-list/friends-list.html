<section class="card green" id="amis">
  <div class="icon" aria-hidden="true">👥</div>
  <div class="content">
    <h2>Liste des amis</h2>
    <div class="inputs">
      <input type="text" [(ngModel)]="name" aria-label="Nom (champ 1)" />
      <input type="text" [(ngModel)]="name" aria-label="Nom (champ 2)" />
      <input type="text" [(ngModel)]="name" aria-label="Nom (champ 3)" />
    </div>
    <ul>
      @for (friend of friends(); track friend) {
        <li>{{ friend }}</li>
      } @empty {
        <li>Aucun ami pour le moment.</li>
      }
    </ul>
  </div>
</section>
